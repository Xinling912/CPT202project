<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Booking System - Success</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>
        /* Specific styling adjustments for the success page */
        .success-card {
            max-width: 340px; /* Make the success card slightly narrower */
            aspect-ratio: 1 / 1; /* Force it into a square shape */
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 3.5rem 2.5rem;
        }
        .success-icon {
            font-size: 1.875rem;
            margin-bottom: 1rem;
        }
        .success-title {
            font-size: 1.125rem;
            font-weight: bold;
            color: #111827;
            margin-bottom: 1.5rem;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="auth-bg">
        <div class="welcome-container">
            <h1 class="welcome-text uppercase">welcome</h1>
        </div>
        <div class="circle ring-large"></div>
        <div class="circle ring-medium"></div>
        <div class="circle ring-small"></div>
    </div>

    <div id="view-container">
        <div class="login-card success-card fade-in">
            <div class="success-icon">😊</div>
            <h3 class="success-title">Registered Successfully !</h3>
            <button id="back-to-login" class="submit-btn">
                Sign in, now!
            </button>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/success.js"></script>
</body>
</html>
