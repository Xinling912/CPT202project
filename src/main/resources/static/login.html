<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Booking System - Log in</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/common.css">
</head>
<body>

    <div id="app">
        
        <div id="auth-bg">
            <div class="welcome-container">
                <h1 class="welcome-text">welcome</h1>
            </div>
            
            <div class="circle ring-large"></div>
            <div class="circle ring-medium"></div>
            <div class="circle ring-small"></div>
        </div>

        <div id="view-container">
            <div class="login-card fade-in">
                <h2 class="card-title">Log in</h2>
                
                <form id="loginForm">
                    <div class="form-group">
                        <label class="form-label">Email</label>
                        <input type="email" id="log-email" class="figma-input" placeholder="Please enter your email address" required>
                    </div>

                    <div class="form-group">
                        <label class="form-label">Password</label>
                        <input type="password" id="log-password" class="figma-input" placeholder="Please enter your password" required>
                    </div>

                    <button type="submit" id="loginBtn" class="submit-btn">
                        Log In
                    </button>
                </form>

                <div class="footer-links">
                    <p class="link-blue" id="go-to-register">Don't have an account? Sign up now!</p>
              
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="../js/login.js"></script>
</body>
</html>
