<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expert Booking System - Log In</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <style>

        .code-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        .code-group input {
            flex: 1;
            min-width: 0;
        }
        .code-group button {
            width: auto;
            min-width: 100px;
            padding: 0 20px;
            margin-top: 0 !important;
        }

        .center-label {
            display: block;
            text-align: center;
            font-weight: 600;
            margin-bottom: 8px;
            color: #1a1a1a;
        }
    </style>
</head>
<body>

<div id="app">
    <div id="auth-bg">
        <div class="welcome-container">
            <h1 class="welcome-text">Welcome</h1>
        </div>
        <div class="circle ring-large"></div>
        <div class="circle ring-medium"></div>
        <div class="circle ring-small"></div>
    </div>

    <div id="view-container">
        <div class="login-card fade-in" id="login-section">
            <h2 class="card-title">Log in</h2>

            <form id="loginForm">
                <div class="form-group">
                    <label class="form-label center-label">Email</label>
                    <input type="text" id="log-email" class="figma-input" placeholder="Please enter your email address" required>
                </div>

                <div class="form-group">
                    <label class="form-label center-label">Password</label>
                    <input type="password" id="log-password" class="figma-input" placeholder="Please enter your password" required>
                </div>

                <button type="submit" id="loginBtn" class="submit-btn">
                    Log In
                </button>
            </form>

            <div class="footer-links" style="text-align: center; margin-top: 20px;">
                <p class="link-blue" id="go-to-register" style="cursor: pointer; margin-bottom: 10px;">Don't have an account? Sign up now!</p>
                <p class="link-blue" id="go-to-forgot" style="cursor: pointer;">Forgot password?</p>
            </div>
        </div>

        <div class="login-card fade-in" id="forgot-section" style="display: none;">
            <h2 class="card-title">Reset Password</h2>

            <form id="forgotForm">
                <div class="form-group">
                    <label class="form-label center-label">Email</label>
                    <input type="email" id="forgot-email" class="figma-input" placeholder="Please enter your email address" required>
                </div>

                <div class="form-group">
                    <label class="form-label center-label">Verification Code</label>
                    <div class="code-group">
                        <div class="verify-row"> <input type="text" id="forgot-code" class="figma-input" placeholder="Please enter the verification code" required>
                            <button type="button" id="sendCodeBtn" class="submit-btn send-btn">Send</button> </div>
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label center-label">New Password</label>

                    <input type="password" id="forgot-new-password" class="figma-input mb-3" placeholder="8-32 characters (letters & numbers)" required>

                    <input type="password" id="forgot-confirm-password" class="figma-input" placeholder="Enter your password again!" required>

                    <div id="pwd-error-msg" style="color: #ef4444; font-size: 0.75rem; display: none; text-align: center; margin-top: 5px; font-weight: 500;">
                        Passwords do not match!
                    </div>
                </div>

                <button type="submit" id="resetBtn" class="submit-btn" style="margin-top: 24px;">
                    Reset Password
                </button>
            </form>

            <div class="footer-links" style="text-align: center; margin-top: 20px;">
                <p class="link-blue" id="back-to-login" style="cursor: pointer;">Back to Log in</p>
            </div>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="js/common.js"></script>
<script src="js/login.js"></script>
</body>
</html>
